[project]
name = "tg-group-summary"
version = "0.1.0"
description = "Telegram group chat summarization monorepo"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "moto[dynamodb,s3]>=5.0",
    "freezegun>=1.4",
    "tg-summary-core",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=3.0",
]

[tool.uv.sources]
tg-summary-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/tg-summary-core/src"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["packages/tg-summary-core/src", "apps", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"packages/tg-summary-core/src/tg_summary_core/report/prompt.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tg_summary_core"]

[tool.mypy]
python_version = "3.13"
mypy_path = "packages/tg-summary-core/src"
packages = ["tg_summary_core"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
