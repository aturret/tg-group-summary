name: Release Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  push_to_ghcr:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "display_tags=latest, ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:stage" >> "$GITHUB_OUTPUT"
            echo "display_tags=stage" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/entrypoint/Dockerfile
          push: true
          platforms: linux/amd64,linux/386,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache,mode=max
      - name: Telegram Notification on Success
        uses: appleboy/telegram-action@master
        if: success()
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ **Docker Image Published Successfully**

            📦 Image: `${{ steps.tags.outputs.tags }}`
            🏷️ Tags: `${{ steps.tags.outputs.display_tags }}`
            🔑 Digest: `${{ steps.push.outputs.digest }}`
            🕐 Timestamp: `${{ github.event.head_commit.timestamp }}`

            📝 Commit: `${{ github.sha }}`
            Message: ${{ github.event.head_commit.message }}
            Author: `${{ github.actor }}`
            Ref: `${{ github.ref_name }}`

            🔗 [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            🔗 [View Image](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
          format: markdown
      - name: Telegram Notification on Failure
        uses: appleboy/telegram-action@master
        if: failure()
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **GitHub Actions Failed** Repo: `${{ github.repository }}`
            Ref: `${{ github.ref_name }}`
            Author: `${{ github.actor }}`
            Details: [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Job: ${{ github.job }} failed!**
          format: markdown
