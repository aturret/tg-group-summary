name: Release Docker image
on:
  push:
    branches:
      - main

jobs:
  push_to_ghcr:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/entrypoint/Dockerfile
          push: true
          platforms: linux/amd64,linux/386,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache,mode=max
      - name: Telegram Notification on Success
        uses: appleboy/telegram-action@master
        if: success()
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ **Docker Image Published Successfully**

            📦 Image: `ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest`
            🏷️ Tag: `latest`
            🔑 Digest: `${{ steps.push.outputs.digest }}`
            🕐 Timestamp: `${{ github.event.head_commit.timestamp }}`

            📝 Commit: `${{ github.sha }}`
            Message: ${{ github.event.head_commit.message }}
            Author: `${{ github.actor }}`
            Branch: `${{ github.ref_name }}`

            🔗 [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            🔗 [View Image](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
          format: markdown
      - name: Telegram Notification on Failure
        uses: appleboy/telegram-action@master
        if: failure()
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **GitHub Actions Failed** Repo: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            Author: `${{ github.actor }}`
            Details: [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Job: ${{ github.job }} failed!**
          format: markdown
