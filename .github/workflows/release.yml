name: Release Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  push_to_ghcr:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "display_tags=latest, ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:stage" >> "$GITHUB_OUTPUT"
            echo "display_tags=stage" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/entrypoint/Dockerfile
          push: true
          platforms: linux/amd64,linux/386,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache,mode=max
      - name: Prepare commit message
        id: commit_msg
        if: success() || failure()
        run: |
          MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          echo "first_line=${MSG}" >> "$GITHUB_OUTPUT"
      - name: Telegram Notification on Success
        uses: appleboy/telegram-action@847a2d3240d33a6137191cc89b3ad7f53e427c06  # master
        if: success()
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ <b>Docker Image Published Successfully</b>

            📦 Image: <code>${{ steps.tags.outputs.tags }}</code>
            🏷️ Tags: <code>${{ steps.tags.outputs.display_tags }}</code>
            🔑 Digest: <code>${{ steps.push.outputs.digest }}</code>
            🕐 Timestamp: <code>${{ github.event.head_commit.timestamp }}</code>

            📝 Commit: <code>${{ github.sha }}</code>
            Message: ${{ steps.commit_msg.outputs.first_line }}
            Author: <code>${{ github.actor }}</code>
            Ref: <code>${{ github.ref_name }}</code>

            🔗 <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
            🔗 <a href="https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}">View Image</a>
          format: html
      - name: Telegram Notification on Failure
        uses: appleboy/telegram-action@847a2d3240d33a6137191cc89b3ad7f53e427c06  # master
        if: failure()
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ <b>GitHub Actions Failed</b> Repo: <code>${{ github.repository }}</code>
            Ref: <code>${{ github.ref_name }}</code>
            Author: <code>${{ github.actor }}</code>
            Details: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a>

            <b>Job: ${{ github.job }} failed!</b>
          format: html
